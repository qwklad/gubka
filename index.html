<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gubka — Соцсеть</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f1419;
            --card: #16181c;
            --border: #2f3336;
            --text: #e7e9ea;
            --muted: #71767b;
            --accent: #f7b500;
            --accent-hover: #d99f00;
            --danger: #f4212e;
            --font-scale: 1;
        }
        [data-theme="dim"] {
            --bg: #15202b;
            --card: #1e2732;
            --border: #38444d;
            --text: #f7f9f9;
            --muted: #8b98a5;
        }
        [data-theme="light"] {
            --bg: #ffffff;
            --card: #f7f9f9;
            --border: #eff3f4;
            --text: #0f1419;
            --muted: #536471;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; font-size: calc(15px * var(--font-scale)); }
        .container { width: 100%; max-width: 600px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); min-height: 100vh; padding-bottom: 60px; display: none; }
        
        /* Полноэкранная авторизация */
        .auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 20px; display: flex; flex-direction: column; gap: 14px; }
        .auth-logo { font-size: 32px; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 4px; }
        .auth-subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
        .auth-switch { text-align: center; font-size: 14px; color: var(--muted); margin-top: 6px; }
        .auth-switch span { color: var(--accent); cursor: pointer; font-weight: 600; }
        .error-msg { color: var(--danger); font-size: 13px; text-align: center; display: none; }

        /* Шапка */
        header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); opacity: 0.95; backdrop-filter: blur(8px); z-index: 10; }
        .logo { font-size: 20px; font-weight: 800; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .nav-btns { display: flex; gap: 8px; align-items: center; }

        /* Вкладки ленты */
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 12px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--text); border-bottom-color: var(--accent); }

        /* Кнопки и поля */
        button { background: var(--accent); color: #000; border: none; padding: 9px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        button.danger { background: var(--danger); color: #fff; }
        button.small { padding: 6px 12px; font-size: 13px; }
        input, textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 11px 12px; border-radius: 10px; font-size: 15px; outline: none; }
        input:focus, textarea:focus { border-color: var(--accent); }

        /* Аватарки */
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #000; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; object-fit: cover; font-size: 18px; }
        .avatar.large { width: 72px; height: 72px; font-size: 28px; }
        .verified-badge { color: var(--accent); font-size: 14px; margin-left: 3px; }

        /* Профиль */
        .profile-box { padding: 16px; border-bottom: 1px solid var(--border); display: none; background: var(--card); }
        .profile-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .profile-info { flex: 1; }
        .profile-name { font-size: 19px; font-weight: 800; display: flex; align-items: center; }
        .profile-handle { color: var(--muted); font-size: 14px; }
        .profile-bio { margin-top: 8px; line-height: 1.4; }
        .profile-stats { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--muted); }
        .profile-stats b { color: var(--text); }

        /* Панель настроек */
        .settings-modal { display: none; padding: 16px; border-bottom: 1px solid var(--border); background: var(--card); flex-direction: column; gap: 14px; }
        .settings-section { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .settings-title { font-weight: 700; font-size: 14px; color: var(--muted); text-transform: uppercase; }
        .color-row { display: flex; gap: 10px; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: var(--text); transform: scale(1.1); }
        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
        .checkbox-row input { width: auto; }

        /* Создание поста */
        .post-creator { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
        .creator-body { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .creator-body textarea { resize: none; height: 75px; border: none; background: transparent; padding: 4px 0; font-size: calc(16px * var(--font-scale)); }
        .creator-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; }
        .file-label { color: var(--accent); font-size: 14px; cursor: pointer; font-weight: 600; }
        #imagePreview { max-width: 100%; max-height: 220px; border-radius: 12px; display: none; object-fit: cover; }

        /* Посты */
        .post { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; }
        .post-main { flex: 1; min-width: 0; }
        .repost-tag { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .post-author { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
        .post-name { font-weight: 700; cursor: pointer; }
        .post-name:hover { text-decoration: underline; }
        .post-handle, .post-time { color: var(--muted); font-size: 13px; }
        .del-btn { color: var(--muted); cursor: pointer; font-size: 13px; }
        .del-btn:hover { color: var(--danger); }
        .post-text { line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
        .post-img { max-width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
        .post-footer { margin-top: 12px; display: flex; justify-content: space-between; max-width: 320px; color: var(--muted); font-size: 14px; }
        .action-btn { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 5px; }
        .action-btn.liked { color: #f91880; font-weight: 700; }
        .action-btn.reposted { color: #00ba7c; font-weight: 700; }

        /* Комментарии */
        .comments-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); display: none; flex-direction: column; gap: 8px; }
        .comment-item { background: var(--card); padding: 8px 12px; border-radius: 10px; font-size: 13px; }
        .comment-author { font-weight: 700; color: var(--accent); margin-right: 6px; }
        .comment-input-row { display: flex; gap: 8px; margin-top: 4px; }
        .comment-input-row input { padding: 8px 10px; font-size: 13px; }
    </style>
</head>
<body>

<!-- Полноэкранный блок входа и регистрации -->
<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <div class="auth-logo">🧽 Gubka</div>
        <div class="auth-subtitle" id="authSubtitle">Войдите, чтобы читать и публиковать</div>
        <input type="text" id="nameInput" placeholder="Имя (только буквы)" maxlength="25" style="display: none;" oninput="filterLettersOnly(this)">
        <input type="text" id="handleInput" placeholder="Юзернейм (только буквы)" maxlength="20" oninput="filterLettersOnly(this)">
        <input type="password" id="passInput" placeholder="Пароль" maxlength="50">
        <div class="error-msg" id="errorMsg"></div>
        <button id="authSubmitBtn" onclick="handleAuth()">Войти</button>
        <div class="auth-switch" id="authSwitchText">
            Нет аккаунта? <span onclick="toggleAuthMode()">Зарегистрироваться</span>
        </div>
    </div>
</div>

<!-- Основной интерфейс соцсети -->
<div class="container" id="mainApp">
    <header>
        <div class="logo" onclick="openHome()">🧽 Gubka</div>
        <div class="nav-btns">
            <button class="outline small" onclick="loadPosts()" title="Обновить ленту">🔄</button>
            <button class="outline small" onclick="openProfile(currentUser.handle)">Профиль</button>
            <button class="outline small" onclick="toggleSettings()">⚙️</button>
        </div>
    </header>

    <!-- Настройки -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-section">
            <div class="settings-title">Профиль</div>
            <input type="text" id="setName" placeholder="Имя (только буквы)" maxlength="25" oninput="filterLettersOnly(this)">
            <input type="text" id="setBio" placeholder="О себе (до 120 символов)" maxlength="120">
            <label class="file-label">
                🖼 Загрузить новую аватарку
                <input type="file" accept="image/*" style="display: none;" onchange="uploadAvatar(event)">
            </label>
            <label class="checkbox-row">
                <input type="checkbox" id="setVerified"> Галочка верификации
            </label>
            <button class="small" onclick="saveProfileSettings()">Сохранить профиль</button>
        </div>

        <div class="settings-section">
            <div class="settings-title">Оформление</div>
            <select id="setTheme" onchange="applyAppearance()">
                <option value="dark">Тема: Тёмная</option>
                <option value="dim">Тема: Сумерки</option>
                <option value="light">Тема: Светлая</option>
            </select>
            <div class="color-row" id="colorPicker">
                <div class="color-dot" style="background: #f7b500;" onclick="setAccent('#f7b500')"></div>
                <div class="color-dot" style="background: #1d9bf0;" onclick="setAccent('#1d9bf0')"></div>
                <div class="color-dot" style="background: #f91880;" onclick="setAccent('#f91880')"></div>
                <div class="color-dot" style="background: #00ba7c;" onclick="setAccent('#00ba7c')"></div>
                <div class="color-dot" style="background: #7856ff;" onclick="setAccent('#7856ff')"></div>
            </div>
            <select id="setFontSize" onchange="applyAppearance()">
                <option value="0.9">Шрифт: Мелкий</option>
                <option value="1" selected>Шрифт: Обычный</option>
                <option value="1.15">Шрифт: Крупный</option>
            </select>
        </div>

        <div class="settings-section" style="border-bottom: none;">
            <div class="settings-title">Безопасность</div>
            <input type="password" id="oldPassInput" placeholder="Текущий пароль" maxlength="50">
            <input type="password" id="newPassInput" placeholder="Новый пароль" maxlength="50">
            <button class="outline small" onclick="changePassword()">Обновить пароль</button>
            <button class="danger small" style="margin-top: 8px;" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>

    <!-- Просмотр профиля -->
    <div class="profile-box" id="profileBox">
        <div class="profile-header">
            <div id="profAvatarWrap"></div>
            <div class="profile-info">
                <div class="profile-name" id="profName"></div>
                <div class="profile-handle" id="profHandle"></div>
                <div class="profile-bio" id="profBio"></div>
                <div class="profile-stats">
                    <span><b id="profPostsCount">0</b> постов</span>
                    <span><b id="profRepostsCount">0</b> репостов</span>
                </div>
            </div>
            <button class="outline small" id="profActionBtn" onclick="toggleSettings()">Настроить</button>
        </div>
    </div>

    <!-- Вкладки -->
    <div class="tabs" id="feedTabs">
        <div class="tab active" id="tabAll" onclick="switchTab('all')">Главная</div>
        <div class="tab" id="tabReposts" onclick="switchTab('reposts')">Репосты</div>
    </div>

    <!-- Создание поста -->
    <div class="post-creator" id="postCreator">
        <div id="creatorAvatarWrap"></div>
        <div class="creator-body">
            <textarea id="postInput" placeholder="Что нового впитал сегодня?" maxlength="500"></textarea>
            <img id="imagePreview" alt="Фото">
            <div class="creator-footer">
                <label class="file-label">
                    📷 Добавить фото
                    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(event)">
                </label>
                <button id="publishBtn" onclick="createPost()">Опубликовать</button>
            </div>
        </div>
    </div>

    <!-- Лента -->
    <div id="feed"></div>
</div>

<script>
    const SUPABASE_URL = 'https://rcxfbotfsgjndzjjqhls.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B2BfD8ybX7GXxj1h1ISuTA_uJZh3Gj3';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isRegisterMode = false;
    let viewingHandle = null;
    let currentTab = 'all';
    let selectedImageBase64 = null;

    let currentUser = JSON.parse(localStorage.getItem('gubka_session')) || null;
    let usersMap = {};
    let posts = [];
    let settings = JSON.parse(localStorage.getItem('gubka_settings')) || { theme: 'dark', accent: '#f7b500', fontScale: '1' };

    function filterLettersOnly(input) {
        input.value = input.value.replace(/[^a-zA-Zа-яА-ЯёЁ]/g, '');
    }

    function compressImage(file, maxWidth, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let w = img.width;
                let h = img.height;
                if (w > maxWidth) {
                    h = Math.round((h * maxWidth) / w);
                    w = maxWidth;
                }
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function applyAppearance() {
        const themeSel = document.getElementById('setTheme');
        const fontSel = document.getElementById('setFontSize');
        if (themeSel && document.getElementById('settingsModal').style.display === 'flex') {
            settings.theme = themeSel.value;
            settings.fontScale = fontSel.value;
        }
        document.documentElement.setAttribute('data-theme', settings.theme);
        document.documentElement.style.setProperty('--accent', settings.accent);
        document.documentElement.style.setProperty('--font-scale', settings.fontScale);
        localStorage.setItem('gubka_settings', JSON.stringify(settings));
    }

    function setAccent(color) {
        settings.accent = color;
        applyAppearance();
    }

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('authSubtitle').innerText = isRegisterMode ? 'Создайте аккаунт (только буквы, без пробелов)' : 'Войдите, чтобы читать и публиковать';
        document.getElementById('nameInput').style.display = isRegisterMode ? 'block' : 'none';
        document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
        document.getElementById('authSwitchText').innerHTML = isRegisterMode
            ? 'Уже есть аккаунт? <span onclick="toggleAuthMode()">Войти</span>'
            : 'Нет аккаунта? <span onclick="toggleAuthMode()">Зарегистрироваться</span>';
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.innerText = msg;
        err.style.display = 'block';
    }

    async function handleAuth() {
        const name = document.getElementById('nameInput').value.replace(/[^a-zA-Zа-яА-ЯёЁ]/g, '');
        const handle = document.getElementById('handleInput').value.replace(/[^a-zA-Zа-яА-ЯёЁ]/g, '').toLowerCase();
        const pass = document.getElementById('passInput').value.trim();

        if (!handle || !pass || (isRegisterMode && !name)) {
            return showError('Заполните все поля (в имени и юзернейме разрешены только буквы).');
        }

        const btn = document.getElementById('authSubmitBtn');
        btn.disabled = true;
        btn.innerText = 'Загрузка...';

        if (isRegisterMode) {
            const { data, error } = await sb.rpc('register_user', {
                p_handle: handle,
                p_name: name,
                p_pass: pass
            });
            btn.disabled = false;
            btn.innerText = 'Зарегистрироваться';

            if (error || (data && data.error)) {
                return showError((data && data.error) || 'Ошибка регистрации.');
            }
            currentUser = data;
        } else {
            const { data, error } = await sb.rpc('login_user', {
                p_handle: handle,
                p_pass: pass
            });
            btn.disabled = false;
            btn.innerText = 'Войти';

            if (error || (data && data.error)) {
                return showError((data && data.error) || 'Неверный юзернейм или пароль.');
            }
            currentUser = data;
        }

        localStorage.setItem('gubka_session', JSON.stringify(currentUser));
        document.getElementById('passInput').value = '';
        await syncData();
        initApp();
    }

    function logout() {
        currentUser = null;
        viewingHandle = null;
        localStorage.removeItem('gubka_session');
        document.getElementById('settingsModal').style.display = 'none';
        initApp();
    }

    async function syncData() {
        const { data: uList } = await sb.from('users').select('*');
        if (uList) {
            usersMap = {};
            uList.forEach(u => {
                usersMap[u.handle] = u;
                if (currentUser && u.handle === currentUser.handle) {
                    currentUser = u;
                    localStorage.setItem('gubka_session', JSON.stringify(currentUser));
                }
            });
        }
        await loadPosts();
    }

    async function loadPosts() {
        const { data: pList } = await sb.from('posts').select('*').order('id', { ascending: false }).limit(100);
        if (pList) {
            posts = pList;
            renderFeed();
        }
    }

    function renderAvatar(user, isLarge = false) {
        const cls = isLarge ? 'avatar large' : 'avatar';
        if (user && user.avatar) {
            return `<img src="${user.avatar}" class="${cls}">`;
        }
        const letter = user && user.name ? user.name[0].toUpperCase() : '?';
        return `<div class="${cls}">${letter}</div>`;
    }

    function toggleSettings() {
        const modal = document.getElementById('settingsModal');
        const isOpen = modal.style.display === 'flex';
        modal.style.display = isOpen ? 'none' : 'flex';
        if (!isOpen && currentUser) {
            document.getElementById('setName').value = currentUser.name;
            document.getElementById('setBio').value = currentUser.bio || '';
            document.getElementById('setVerified').checked = !!currentUser.verified;
            document.getElementById('setTheme').value = settings.theme;
            document.getElementById('setFontSize').value = settings.fontScale;
        }
    }

    async function saveProfileSettings() {
        const newName = document.getElementById('setName').value.replace(/[^a-zA-Zа-яА-ЯёЁ]/g, '');
        const newBio = document.getElementById('setBio').value.trim().slice(0, 120);
        const isVer = document.getElementById('setVerified').checked;
        if (!newName) return alert('Имя должно содержать хотя бы одну букву.');

        await sb.from('users').update({ name: newName, bio: newBio, verified: isVer }).eq('handle', currentUser.handle);
        await sb.from('posts').update({ name: newName }).eq('handle', currentUser.handle);

        currentUser.name = newName;
        currentUser.bio = newBio;
        currentUser.verified = isVer;
        localStorage.setItem('gubka_session', JSON.stringify(currentUser));

        document.getElementById('settingsModal').style.display = 'none';
        await syncData();
        initApp();
    }

    function uploadAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        compressImage(file, 200, async (base64) => {
            await sb.from('users').update({ avatar: base64 }).eq('handle', currentUser.handle);
            currentUser.avatar = base64;
            localStorage.setItem('gubka_session', JSON.stringify(currentUser));
            await syncData();
            initApp();
        });
    }

    async function changePassword() {
        const oldP = document.getElementById('oldPassInput').value.trim();
        const newP = document.getElementById('newPassInput').value.trim();
        if (!oldP || !newP) return alert('Введите старый и новый пароль.');

        const { data, error } = await sb.rpc('change_pass', {
            p_handle: currentUser.handle,
            p_old_pass: oldP,
            p_new_pass: newP
        });

        if (error || (data && data.error)) {
            return alert((data && data.error) || 'Ошибка смены пароля.');
        }

        document.getElementById('oldPassInput').value = '';
        document.getElementById('newPassInput').value = '';
        alert('Пароль успешно изменён!');
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        compressImage(file, 800, (base64) => {
            selectedImageBase64 = base64;
            const prev = document.getElementById('imagePreview');
            prev.src = selectedImageBase64;
            prev.style.display = 'block';
        });
    }

    async function createPost() {
        const text = document.getElementById('postInput').value.trim().slice(0, 500);
        if (!text && !selectedImageBase64) return;

        const btn = document.getElementById('publishBtn');
        btn.disabled = true;

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

        const newPost = {
            id: Date.now(),
            handle: currentUser.handle,
            name: currentUser.name,
            text: text,
            img: selectedImageBase64 || '',
            time: timeStr,
            likes: [],
            reposts: [],
            comments: []
        };

        await sb.from('posts').insert(newPost);

        document.getElementById('postInput').value = '';
        document.getElementById('imageInput').value = '';
        document.getElementById('imagePreview').style.display = 'none';
        selectedImageBase64 = null;
        btn.disabled = false;
        await loadPosts();
    }

    async function deletePost(id) {
        await sb.from('posts').delete().eq('id', id);
        await loadPosts();
    }

    async function toggleLike(id) {
        const post = posts.find(p => p.id === id);
        if (!post) return;
        let likes = post.likes || [];
        const idx = likes.indexOf(currentUser.handle);
        if (idx === -1) likes.push(currentUser.handle);
        else likes.splice(idx, 1);

        await sb.from('posts').update({ likes }).eq('id', id);
        await loadPosts();
    }

    async function toggleRepost(id) {
        const post = posts.find(p => p.id === id);
        if (!post) return;
        let reposts = post.reposts || [];
        const idx = reposts.indexOf(currentUser.handle);
        if (idx === -1) reposts.push(currentUser.handle);
        else reposts.splice(idx, 1);

        await sb.from('posts').update({ reposts }).eq('id', id);
        await loadPosts();
    }

    function toggleComments(id) {
        const box = document.getElementById('comments-' + id);
        box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    async function addComment(id) {
        const input = document.getElementById('comm-input-' + id);
        const text = input.value.trim().slice(0, 250);
        if (!text) return;

        const post = posts.find(p => p.id === id);
        if (!post) return;
        let comments = post.comments || [];
        comments.push({ author: currentUser.name, handle: currentUser.handle, text });

        await sb.from('posts').update({ comments }).eq('id', id);
        await loadPosts();
        const box = document.getElementById('comments-' + id);
        if (box) box.style.display = 'flex';
    }

    function openProfile(handle) {
        viewingHandle = handle;
        document.getElementById('settingsModal').style.display = 'none';
        initApp();
    }

    function openHome() {
        viewingHandle = null;
        currentTab = 'all';
        document.getElementById('settingsModal').style.display = 'none';
        initApp();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabAll').classList.toggle('active', tab === 'all');
        document.getElementById('tabReposts').classList.toggle('active', tab === 'reposts');
        renderFeed();
    }

    function escapeHTML(str) {
        return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])) : '';
    }

    function renderFeed() {
        const feed = document.getElementById('feed');
        let list = posts;

        if (viewingHandle) {
            list = posts.filter(p => p.handle === viewingHandle || (p.reposts && p.reposts.includes(viewingHandle)));
        } else if (currentTab === 'reposts') {
            list = posts.filter(p => p.reposts && p.reposts.includes(currentUser.handle));
        }

        if (list.length === 0) {
            feed.innerHTML = `<div style="padding: 30px; text-align: center; color: var(--muted);">Здесь пока пусто</div>`;
            return;
        }

        feed.innerHTML = list.map(post => {
            const authorUser = usersMap[post.handle] || { name: post.name, handle: post.handle };
            const likes = post.likes || [];
            const reposts = post.reposts || [];
            const comments = post.comments || [];
            const isLiked = likes.includes(currentUser.handle);
            const isReposted = reposts.includes(currentUser.handle);
            const showRepostBanner = (viewingHandle && post.handle !== viewingHandle && reposts.includes(viewingHandle)) || (currentTab === 'reposts' && isReposted);

            return `
            <div class="post">
                <div onclick="openProfile('${post.handle}')" style="cursor:pointer;">${renderAvatar(authorUser)}</div>
                <div class="post-main">
                    ${showRepostBanner ? `<div class="repost-tag">🔁 Репост</div>` : ''}
                    <div class="post-header">
                        <div class="post-author">
                            <span class="post-name" onclick="openProfile('${post.handle}')">${escapeHTML(authorUser.name)}</span>
                            ${authorUser.verified ? '<span class="verified-badge">✔</span>' : ''}
                            <span class="post-handle">@${escapeHTML(post.handle)}</span>
                            <span class="post-time">· ${post.time}</span>
                        </div>
                        ${post.handle === currentUser.handle ? `<span class="del-btn" onclick="deletePost(${post.id})">🗑</span>` : ''}
                    </div>
                    <div class="post-text">${escapeHTML(post.text)}</div>
                    ${post.img ? `<img src="${post.img}" class="post-img">` : ''}
                    <div class="post-footer">
                        <span class="action-btn" onclick="toggleComments(${post.id})">💬 ${comments.length}</span>
                        <span class="action-btn ${isReposted ? 'reposted' : ''}" onclick="toggleRepost(${post.id})">🔁 ${reposts.length}</span>
                        <span class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${post.id})">❤️ ${likes.length}</span>
                    </div>
                    <div class="comments-section" id="comments-${post.id}">
                        ${comments.map(c => `<div class="comment-item"><span class="comment-author">${escapeHTML(c.author)}:</span>${escapeHTML(c.text)}</div>`).join('')}
                        <div class="comment-input-row">
                            <input type="text" id="comm-input-${post.id}" placeholder="Написать ответ..." maxlength="250">
                            <button class="small" onclick="addComment(${post.id})">➤</button>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function initApp() {
        applyAppearance();
        const authScreen = document.getElementById('authScreen');
        const mainApp = document.getElementById('mainApp');

        if (!currentUser) {
            authScreen.style.display = 'flex';
            mainApp.style.display = 'none';
            return;
        }

        authScreen.style.display = 'none';
        mainApp.style.display = 'block';
        document.getElementById('creatorAvatarWrap').innerHTML = renderAvatar(currentUser);

        const profileBox = document.getElementById('profileBox');
        const feedTabs = document.getElementById('feedTabs');
        const postCreator = document.getElementById('postCreator');

        if (viewingHandle) {
            const pUser = usersMap[viewingHandle] || { name: viewingHandle, handle: viewingHandle, bio: '' };
            profileBox.style.display = 'block';
            feedTabs.style.display = 'none';
            postCreator.style.display = viewingHandle === currentUser.handle ? 'flex' : 'none';

            document.getElementById('profAvatarWrap').innerHTML = renderAvatar(pUser, true);
            document.getElementById('profName').innerHTML = `${escapeHTML(pUser.name)} ${pUser.verified ? '<span class="verified-badge">✔</span>' : ''}`;
            document.getElementById('profHandle').innerText = '@' + pUser.handle;
            document.getElementById('profBio').innerText = pUser.bio || 'Нет описания';
            document.getElementById('profPostsCount').innerText = posts.filter(p => p.handle === viewingHandle).length;
            document.getElementById('profRepostsCount').innerText = posts.filter(p => p.reposts && p.reposts.includes(viewingHandle)).length;

            const actionBtn = document.getElementById('profActionBtn');
            if (viewingHandle === currentUser.handle) {
                actionBtn.innerText = 'Настроить';
                actionBtn.onclick = toggleSettings;
            } else {
                actionBtn.innerText = 'Назад';
                actionBtn.onclick = openHome;
            }
        } else {
            profileBox.style.display = 'none';
            feedTabs.style.display = 'flex';
            postCreator.style.display = 'flex';
        }

        renderFeed();
    }

    (async () => {
        applyAppearance();
        if (currentUser) {
            await syncData();
        }
        initApp();
        setInterval(() => {
            if (currentUser && document.visibilityState === 'visible') {
                loadPosts();
            }
        }, 15000);
    })();
</script>
</body>
</html>
